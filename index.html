<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>My Goals Tracker</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#3a1f94">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Goals">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&family=Dancing+Script:wght@700&display=swap">
<style>
:root{--bg:#efeaff;--card:#fff;--text:#1d1a3f;--muted:#7d7aa6;--brand:#6a3df0;--line:#ebe6ff;--sh:0 8px 24px -10px rgba(90,60,200,.35);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d0a22;--card:#1a1638;--text:#f1eeff;--muted:#9d99c6;--line:#2b2752;--brand:#8b6bff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d0a22;--card:#1a1638;--text:#f1eeff;--muted:#9d99c6;--line:#2b2752;--brand:#8b6bff;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Poppins",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button{font-family:inherit;cursor:pointer}button:active{transform:scale(.96)}
.app{max-width:480px;margin:0 auto;padding-bottom:110px}
.top{background:linear-gradient(180deg,#3a1f94,#5a2fc0);color:#fff;padding:14px 16px 0}
.bar{display:flex;align-items:center;gap:8px}
.ib{width:40px;height:40px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;font-size:18px;flex:none}
.ttl{flex:1;text-align:center}
.ttl h1{margin:0;font-size:20px;line-height:1.1}.ttl h1 b{color:#ffd400}
.ttl small{font-size:11px;opacity:.9;letter-spacing:.04em}
.hero{position:relative;height:210px;margin:6px -16px 0;overflow:hidden}
.hero svg{position:absolute;inset:0;width:100%;height:100%}
.tag{position:absolute;right:14px;top:34px;font-family:"Segoe Script","Bradley Hand","Comic Sans MS",cursive;font-size:21px;line-height:1.25;text-align:right;text-shadow:0 2px 8px rgba(40,10,90,.5)}
.tag::after{content:"";display:block;height:4px;border-radius:4px;background:#ffd400;margin-top:4px;transform:rotate(-2deg)}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;padding:0 12px;margin-top:-52px;position:relative}
.sc{background:rgba(70,40,150,.55);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.35);border-radius:18px;padding:10px 2px;text-align:center;color:#fff}
.sc i{display:block;font-style:normal;font-size:26px}.sc b{display:block;font-size:22px;line-height:1.1}.sc small{font-size:10.5px}
.panel{background:var(--card);border-radius:26px;margin:14px 10px 0;padding:14px 12px;box-shadow:var(--sh)}
.ph{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.ph h2{margin:0;font-size:19px}
.addb{border:0;border-radius:999px;background:linear-gradient(135deg,#6a3df0,#8a4df5);color:#fff;font-weight:600;font-size:13px;padding:10px 14px}
.g{display:flex;align-items:center;gap:12px;padding:11px;border-radius:20px;background:var(--bg);margin-bottom:10px;animation:in .35s both}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
.gi{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;font-size:24px;flex:none}
.gm{flex:1;min-width:0}.gm b{display:block;font-size:14.5px;line-height:1.25}
.pr{display:flex;align-items:center;gap:8px;margin:5px 0 4px}
.pt{flex:1;height:8px;border-radius:9px;background:var(--line);overflow:hidden}.pt i{display:block;height:100%;border-radius:9px;transition:width .4s}
.pr span{font-size:12px;font-weight:700;width:34px}
.gm small{color:var(--muted);font-size:11.5px}
.chip{font-size:11px;font-weight:600;padding:7px 9px;border-radius:999px;white-space:nowrap}
.c{background:#dcf7e6;color:#10a24f}.i{background:#dbeafe;color:#2563eb}.p{background:#eadcff;color:#7a3be0}
.dots{background:none;border:0;color:var(--muted);font-size:20px;padding:4px}
.empty{text-align:center;color:var(--muted);padding:34px 10px;font-size:14px}.empty span{font-size:44px;display:block}
.nav{position:fixed;left:0;right:0;bottom:0;max-width:480px;margin:0 auto;background:var(--card);border-radius:24px 24px 0 0;box-shadow:0 -6px 24px -10px rgba(90,60,200,.4);display:flex;padding:8px 6px calc(8px + env(safe-area-inset-bottom,0px));z-index:4}
.nb{flex:1;border:0;background:none;color:var(--muted);font-size:11.5px;font-weight:600;position:relative;padding:4px 0 6px}
.nb i{display:block;font-style:normal;font-size:22px}
.nb.on{color:var(--brand)}.nb.on::after{content:"";position:absolute;left:18%;right:18%;bottom:0;height:3px;border-radius:3px;background:var(--brand)}
.bd{position:absolute;top:-2px;left:56%;background:#ef4444;color:#fff;border-radius:50%;width:17px;height:17px;font-size:10px;display:grid;place-items:center}
.ov{position:fixed;inset:0;background:rgba(10,8,30,.55);display:none;align-items:flex-end;justify-content:center;z-index:8}.ov.on{display:flex}
.sheet{background:var(--card);width:100%;max-width:480px;border-radius:28px 28px 0 0;padding:12px 20px calc(24px + env(safe-area-inset-bottom,0px));display:grid;gap:12px;max-height:90vh;overflow:auto;animation:up .28s}
@keyframes up{from{transform:translateY(50px);opacity:0}}
.sheet::before{content:"";width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:19px}
input[type=text],input[type=date]{width:100%;padding:13px;border-radius:14px;border:2px solid transparent;background:var(--bg);color:var(--text);font:inherit;font-size:16px;outline:0}
input:focus{border-color:var(--brand)}
input[type=range]{width:100%;accent-color:var(--brand)}
.ics{display:flex;gap:8px;flex-wrap:wrap}.ico{width:46px;height:46px;border-radius:50%;border:2px solid transparent;font-size:22px;background:var(--bg)}.ico.on{border-color:var(--brand)}
.big{padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,#6a3df0,#8a4df5);color:#fff;font-size:16px;font-weight:700}
.del{padding:12px;border:0;border-radius:14px;background:#fee2e2;color:#dc2626;font-weight:600;font-size:15px}
.row{display:flex;justify-content:space-between;align-items:center;padding:11px 0;border-bottom:1px solid var(--line);font-size:14px;gap:10px}.row:last-child{border:0}
.mh{font-size:12px;font-weight:700;color:var(--brand);text-transform:uppercase;letter-spacing:.1em;margin:14px 0 4px}
.bigp{font-size:44px;font-weight:700;color:var(--brand);text-align:center;margin:4px 0}
.ib{position:relative}
.nb[onclick*="'ai'"]{flex:none;width:66px;height:66px;margin-top:-28px;border-radius:50%;background:linear-gradient(135deg,#6a3df0,#38bdf8);color:#fff;box-shadow:0 8px 20px rgba(106,61,240,.5);border:4px solid var(--card);padding:4px 0 0}
.nb[onclick*="'ai'"]::after{display:none}.nb[onclick*="'ai'"] i{font-size:24px}
.askai{display:flex;align-items:center;gap:12px;margin:12px 10px 0;padding:14px 16px;border-radius:22px;background:linear-gradient(135deg,#3b2fd0,#6a3df0 60%,#38a8f8);color:#fff;font-weight:600;font-size:15px;line-height:1.3;box-shadow:var(--sh);cursor:pointer}
.askai i{font-style:normal;font-size:34px}.askai span{margin-left:auto;font-size:26px}
.act{width:38px;height:38px;border-radius:50%;border:0;color:#fff;font-size:16px;flex:none}
.scr{position:fixed;inset:0;z-index:7;background:var(--bg);display:none;flex-direction:column;max-width:480px;margin:0 auto;padding-top:env(safe-area-inset-top,0px)}
.scr.on{display:flex}
.sh1{background:linear-gradient(180deg,#3a1f94,#5a2fc0);color:#fff;padding:12px 16px 20px;display:flex;align-items:center;gap:12px}
.sh1 h2{margin:0;font-size:19px}.sh1 small{opacity:.9;font-size:12.5px}
.bk{width:38px;height:38px;border-radius:50%;border:0;background:rgba(255,255,255,.16);color:#fff;font-size:22px;flex:none}
.rb{font-size:34px}
.body{flex:1;overflow:auto;padding:14px 14px 24px;background:var(--bg);border-radius:24px 24px 0 0;margin-top:-12px}
.ring2{--p:0;width:180px;height:180px;border-radius:50%;margin:6px auto 14px;background:conic-gradient(#16b35a calc(var(--p)*1%),var(--line) 0);display:grid;place-items:center;position:relative}
.ring2::before{content:"";position:absolute;inset:15px;border-radius:50%;background:var(--card)}
.ring2 div{position:relative;text-align:center;font-size:38px;font-weight:700;line-height:1.1}.ring2 small{display:block;font-size:14px;font-weight:600}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.mc{background:var(--card);border-radius:18px;padding:12px;text-align:center;font-size:13px;color:var(--muted)}.mc b{display:block;font-size:17px;color:var(--text)}
.box{background:var(--card);border-radius:20px;padding:14px;margin-top:12px;box-shadow:var(--sh)}
.tips{display:flex;gap:10px;align-items:flex-start}.tips i{font-style:normal;font-size:34px}
.btn3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.btn3 button{padding:12px 0;border:0;border-radius:14px;background:var(--card);color:var(--brand);font-weight:600;font-size:14px}
.msgs{display:flex;flex-direction:column;gap:10px}
.m{max-width:84%;padding:11px 14px;border-radius:18px;font-size:14.5px;line-height:1.45;word-break:break-word}
.m.b{background:var(--card);align-self:flex-start;border-top-left-radius:6px;box-shadow:var(--sh)}
.m.u{background:linear-gradient(135deg,#6a3df0,#8a4df5);color:#fff;align-self:flex-end;border-top-right-radius:6px}
.q{border:0;background:var(--card);color:var(--text);padding:11px 16px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--sh);align-self:flex-start}
.q.p{background:linear-gradient(135deg,#6a3df0,#8a4df5);color:#fff}
.inp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom,0px));background:var(--bg)}
.inp input{flex:1;min-width:0;padding:13px 16px;border-radius:999px;border:0;background:var(--card);color:var(--text);font:inherit;font-size:15px;outline:0}
.send{width:48px;height:48px;border-radius:50%;border:0;background:linear-gradient(135deg,#6a3df0,#8a4df5);color:#fff;font-size:20px;flex:none}
.toast{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:14px;z-index:20;display:none;white-space:nowrap}
.top{background:#3a1f94}
.bar{align-items:flex-start;gap:10px;padding-top:6px}
.lg{font-size:54px;line-height:1;filter:drop-shadow(0 4px 8px rgba(0,0,0,.3))}
.ttl{text-align:left}.ttl h1{font-size:27px;line-height:1.05}.ttl small{display:block;margin-top:5px;font-size:12.5px}
.rt{display:flex;flex-direction:column;gap:8px}
.hero{height:300px;margin-top:-4px}
.tag{top:34px;right:16px;font-size:23px}
.panel{background:color-mix(in srgb,var(--bg) 60%,var(--card))}
.g{background:var(--card);box-shadow:0 6px 16px -8px rgba(90,60,200,.4);border:1px solid var(--line)}
.gi{width:56px;height:56px;font-size:28px}.pt{height:9px}
.rb svg{width:52px;height:52px;display:block}
.askai i svg{width:50px;height:50px;display:block}
.nb[onclick*="'ai'"] i svg{width:34px;height:34px;display:block;margin:0 auto}
.tips i svg{width:50px;height:50px;display:block}
.sc{background:rgba(60,30,140,.5)}
.top{position:relative;overflow:hidden;background:#3a1f94;padding-bottom:14px}
.top>*{position:relative;z-index:1}
.top>.bgsvg{position:absolute;inset:0;width:100%;height:100%;z-index:0}
.bar{padding-top:2px}
.lg{font-size:46px}
.ttl h1{font-size:24px}.ttl small{font-size:12px;margin-top:3px}
.ib{width:36px;height:36px;font-size:16px}
.rt{gap:6px}
.hero{height:116px;margin:0;overflow:visible}
.tag{top:20px;right:2px;font-size:22px}
.stats{margin-top:0;padding:0}
.sc{padding:8px 2px}.sc i{font-size:26px}.sc b{font-size:21px}
.g{padding:9px 10px;margin-bottom:8px}
.gi{width:50px;height:50px;font-size:26px}
.bgsvg{display:none}
.top{background:linear-gradient(180deg,#3a1f94,#4b2bb8)}

.top{padding-bottom:14px}
